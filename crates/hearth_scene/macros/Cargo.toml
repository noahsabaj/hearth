[package]
name = "hearth_scene_macros"
version = "0.20.0-dev"
edition = "2024"
description = "Derive implementations for hearth_scene"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[lib]
proc-macro = true

[dependencies]
hearth_macro_utils = { path = "../../hearth_macro_utils", version = "0.20.0-dev" }
hearth_ecs_macro_logic = { path = "../../hearth_ecs/macro_logic", version = "0.20.0-dev" }

proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3", features = ["full", "extra-traits"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
