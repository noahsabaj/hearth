[package]
name = "hearth_state"
version = "0.20.0-dev"
edition = "2024"
description = "Finite state machines for Hearth"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[features]
default = ["std", "hearth_reflect", "hearth_app"]

# Functionality

## Adds runtime reflection support using `hearth_reflect`.
hearth_reflect = [
  "dep:hearth_reflect",
  "hearth_ecs/hearth_reflect",
  "hearth_app?/hearth_reflect",
]

## Adds integration with the `hearth_app` plugin API.
hearth_app = ["dep:hearth_app"]

# Platform Compatibility

## Allows access to the `std` crate. Enabling this feature will prevent compilation
## on `no_std` targets, but provides access to certain additional features on
## supported platforms.
std = [
  "hearth_ecs/std",
  "hearth_reflect?/std",
  "hearth_app?/std",
  "hearth_platform/std",
]

## `critical-section` provides the building blocks for synchronization primitives
## on all platforms, including `no_std`.
critical-section = [
  "hearth_ecs/critical-section",
  "hearth_app?/critical-section",
  "hearth_reflect?/critical-section",
  "hearth_platform/critical-section",
]

[dependencies]
# hearth
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev", default-features = false }
hearth_state_macros = { path = "macros", version = "0.20.0-dev" }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev", default-features = false }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", default-features = false, optional = true }
hearth_app = { path = "../hearth_app", version = "0.20.0-dev", default-features = false, optional = true }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev", default-features = false }
variadics_please = "2.0"

# other
log = { version = "0.4", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
