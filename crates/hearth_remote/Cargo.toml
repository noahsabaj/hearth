[package]
name = "hearth_remote"
version = "0.20.0-dev"
edition = "2024"
description = "The Hearth Remote Protocol"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[features]
default = ["http", "hearth_asset", "hearth_render"]
http = [
  "dep:async-io",
  "dep:hyper",
  "dep:smol-hyper",
  "dep:http-body-util",
  "hearth_tasks/async-io",
]
client = [
  "dep:async-io",
  "dep:hyper",
  "dep:smol-hyper",
  "dep:http-body-util",
  "hyper/client",
  "hearth_tasks/async-io",
]
hearth_asset = ["dep:hearth_asset"]
hearth_debug_stepping = ["hearth_ecs/hearth_debug_stepping"]
hearth_render = [
  "dep:hearth_render",
  "dep:hearth_window",
  "dep:base64",
  "hearth_dev_tools/render",
]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_color = { path = "../hearth_color", version = "0.20.0-dev" }
hearth_derive = { path = "../hearth_derive", version = "0.20.0-dev" }
hearth_dev_tools = { path = "../hearth_dev_tools", version = "0.20.0-dev", features = [
  "schedule_data",
  "serialize",
] }
hearth_diagnostic = { path = "../hearth_diagnostic", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev", features = [
  "serialize",
] }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev" }
hearth_render = { path = "../hearth_render", version = "0.20.0-dev", optional = true }
hearth_window = { path = "../hearth_window", version = "0.20.0-dev", optional = true }
hearth_tasks = { path = "../hearth_tasks", version = "0.20.0-dev" }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev", features = [
  "debug",
] }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
  "serialize",
] }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev", optional = true }
hearth_log = { path = "../hearth_log", version = "0.20.0-dev" }

# other
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
async-channel = "2"
base64 = { version = "0.22", optional = true }

# dependencies that will not compile on wasm
[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-io = { version = "2", optional = true }
hyper = { version = "1", optional = true, features = ["server", "http1"] }
smol-hyper = { version = "0.1", optional = true }
http-body-util = { version = "0.1", optional = true }

[dev-dependencies]
hearth_tasks = { path = "../hearth_tasks", version = "0.20.0-dev", features = [
  "multi_threaded",
] }
hearth_remote = { path = ".", features = ["client"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--cfg",
  "docsrs",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
