[package]
name = "hearth_macro_utils"
version = "0.20.0-dev"
edition = "2024"
description = "A collection of utils for Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[dependencies]
syn = "3"
quote = "1.0"
proc-macro2 = "1.0"
toml_edit = { version = "0.25.1", default-features = false, features = [
  "parse",
] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
