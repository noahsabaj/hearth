[package]
name = "hearth_mesh"
version = "0.20.0-dev"
edition = "2024"
description = "Provides mesh types for Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev" }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev" }
hearth_shape = { path = "../hearth_shape", version = "0.20.0-dev", features = [
  "hearth_reflect",
] }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev" }
hearth_mikktspace = { path = "../hearth_mikktspace", version = "0.20.0-dev", optional = true }
hearth_derive = { path = "../hearth_derive", version = "0.20.0-dev" }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
  "serialize",
] }

# other
bitflags = { version = "2.3", features = ["serde"] }
bytemuck = { version = "1.5", features = ["must_cast"] }
wgpu-types = { version = "30", default-features = false }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }
hexasphere = "19.0"
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
derive_more = { version = "2", default-features = false, features = ["from"] }
half = { version = "2.4.1", features = ["bytemuck"] }
encase = "0.13"
glam = { version = "0.33.9", default-features = false, optional = true }

[dev-dependencies]
approx = "0.5"
serde_json = "1.0.140"

[features]
default = []
## Adds serialization support through `serde`.
serialize = ["dep:serde", "wgpu-types/serde", "half/serde"]
morph = ["glam/encase-013"]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
