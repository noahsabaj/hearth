[package]
name = "hearth_camera_controller"
version = "0.20.0-dev"
edition = "2024"
description = "Premade camera controllers for Hearth"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth", "input", "camera", "control"]
rust-version = "1.85.0"

[dependencies]
hearth_app = { path = "../hearth_app", version = "0.20.0-dev", default-features = false }
hearth_camera = { path = "../hearth_camera", version = "0.20.0-dev", default-features = false }
hearth_curve = { path = "../hearth_curve", version = "0.20.0-dev", default-features = false }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev", default-features = false }
hearth_input = { path = "../hearth_input", version = "0.20.0-dev", default-features = false }
hearth_log = { path = "../hearth_log", version = "0.20.0-dev", default-features = false }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev", default-features = false }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", default-features = false, optional = true }
hearth_time = { path = "../hearth_time", version = "0.20.0-dev", default-features = false }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev", default-features = false }
hearth_window = { path = "../hearth_window", version = "0.20.0-dev", default-features = false }
hearth_picking = { path = "../hearth_picking", version = "0.20.0-dev", default-features = false }

hearth_derive = { path = "../hearth_derive", version = "0.20.0-dev" }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev" }
hearth_image = { path = "../hearth_image", version = "0.20.0-dev" }
hearth_render = { path = "../hearth_render", version = "0.20.0-dev" }
hearth_color = { path = "../hearth_color", version = "0.20.0-dev" }

hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev", optional = true }
hearth_core_pipeline = { path = "../hearth_core_pipeline", version = "0.20.0-dev", optional = true }
hearth_gizmos = { path = "../hearth_gizmos", version = "0.20.0-dev", optional = true }


[features]
default = ["hearth_reflect"]
hearth_reflect = ["dep:hearth_reflect"]
libm = ["hearth_math/libm"]

# Camera controllers
free_camera = []
pan_camera = []
pan_orbit_camera = []

# PanOrbitCamera's extensions

extension_anchor_indicator = ["dep:hearth_gizmos", "pan_orbit_camera"]
extension_independent_skybox = [
  "pan_orbit_camera",
  "hearth_asset",
  "hearth_core_pipeline",
]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
