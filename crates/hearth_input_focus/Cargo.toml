[package]
name = "hearth_input_focus"
version = "0.20.0-dev"
edition = "2024"
description = "Keyboard focus management"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]
rust-version = "1.94.0"

[features]
default = [
  "std",
  "hearth_reflect",
  "hearth_ecs/async_executor",
  "gamepad",
  "keyboard",
  "mouse",
]
gamepad = ["hearth_input/gamepad"]
keyboard = ["hearth_input/keyboard"]
mouse = ["hearth_input/mouse"]

# Functionality

## Adds runtime reflection support using `hearth_reflect`.
hearth_reflect = [
  "dep:hearth_reflect",
  "hearth_app/hearth_reflect",
  "hearth_ecs/hearth_reflect",
  "hearth_math/hearth_reflect",
  "hearth_input/hearth_reflect",
  "hearth_window/hearth_reflect",
]

## Adds serialization support through `serde`.
serialize = [
  "hearth_ecs/serialize",
  "hearth_math/serialize",
  "hearth_input/serialize",
  "hearth_window/serialize",
]

# Platform Compatibility

## Allows access to the `std` crate. Enabling this feature will prevent compilation
## on `no_std` targets, but provides access to certain additional features on
## supported platforms.
std = [
  "hearth_app/std",
  "hearth_ecs/std",
  "hearth_math/std",
  "hearth_reflect/std",
  "hearth_input/std",
  "hearth_window/std",
]

## `critical-section` provides the building blocks for synchronization primitives
## on all platforms, including `no_std`.
critical-section = [
  "hearth_app/critical-section",
  "hearth_ecs/critical-section",
  "hearth_reflect?/critical-section",
  "hearth_input/critical-section",
]

## Uses the `libm` maths library instead of the one provided in `std` and `core`.
libm = ["hearth_math/libm", "hearth_window/libm"]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev", default-features = false }
hearth_camera = { path = "../hearth_camera", version = "0.20.0-dev", default-features = false }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev", default-features = false }
hearth_input = { path = "../hearth_input", version = "0.20.0-dev", default-features = false }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev", default-features = false }
hearth_picking = { path = "../hearth_picking", version = "0.20.0-dev", default-features = false, optional = true }
hearth_window = { path = "../hearth_window", version = "0.20.0-dev", default-features = false }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", features = [
  "glam",
], default-features = false, optional = true }

# other
thiserror = { version = "2", default-features = false }
log = { version = "0.4", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
