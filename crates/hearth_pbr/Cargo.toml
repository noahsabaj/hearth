[package]
name = "hearth_pbr"
version = "0.20.0-dev"
edition = "2024"
description = "Adds PBR rendering to Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[features]
webgl = ["hearth_light/webgl"]
webgpu = ["hearth_light/webgpu"]
pbr_transmission_textures = ["hearth_gltf?/pbr_transmission_textures"]
pbr_multi_layer_material_textures = [
  "hearth_gltf?/pbr_multi_layer_material_textures",
]
pbr_anisotropy_texture = ["hearth_gltf?/pbr_anisotropy_texture"]
pbr_specular_textures = ["hearth_gltf?/pbr_specular_textures"]
experimental_pbr_pcss = ["hearth_light/experimental_pbr_pcss"]
pbr_clustered_decals = []
pbr_light_textures = []
bluenoise_texture = ["hearth_image/ktx2", "hearth_image/zstd"]
dfg_lut = ["hearth_image/ktx2", "hearth_image/zstd"]
area_light_luts = ["hearth_image/ktx2", "hearth_image/zstd"]
trace = ["hearth_render/trace"]
# Enables the meshlet renderer for dense high-poly scenes (experimental)
meshlet = ["dep:lz4_flex", "dep:range-alloc"]
# Enables processing meshes into meshlet meshes
meshlet_processor = [
  "meshlet",
  "dep:meshopt",
  "dep:metis",
  "dep:itertools",
  "dep:bitvec",
]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev" }
hearth_color = { path = "../hearth_color", version = "0.20.0-dev" }
hearth_core_pipeline = { path = "../hearth_core_pipeline", version = "0.20.0-dev" }
hearth_derive = { path = "../hearth_derive", version = "0.20.0-dev" }
hearth_diagnostic = { path = "../hearth_diagnostic", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }
hearth_extract = { path = "../hearth_extract", version = "0.20.0-dev" }
hearth_gltf = { path = "../hearth_gltf", version = "0.20.0-dev", optional = true }
hearth_light = { path = "../hearth_light", version = "0.20.0-dev" }
hearth_log = { path = "../hearth_log", version = "0.20.0-dev" }
hearth_image = { path = "../hearth_image", version = "0.20.0-dev" }
hearth_mesh = { path = "../hearth_mesh", version = "0.20.0-dev", features = [
  "morph",
  "hearth_mikktspace",
] }
hearth_shader = { path = "../hearth_shader", version = "0.20.0-dev" }
hearth_material = { path = "../hearth_material", version = "0.20.0-dev" }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev" }
hearth_shape = { path = "../hearth_shape", version = "0.20.0-dev" }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev" }
hearth_render = { path = "../hearth_render", version = "0.20.0-dev", features = [
  "morph",
] }
hearth_camera = { path = "../hearth_camera", version = "0.20.0-dev" }
hearth_tasks = { path = "../hearth_tasks", version = "0.20.0-dev" }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev" }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev" }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
] }

# other
bitflags = { version = "2.3", features = ["bytemuck"] }
fixedbitset = "0.5"
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
# meshlet
lz4_flex = { version = "0.14", default-features = false, features = [
  "frame",
], optional = true }
range-alloc = { version = "0.1", optional = true }
meshopt = { version = "0.6.2", optional = true }
metis = { version = "0.2.2", optional = true }
itertools = { version = "0.14", optional = true }
bitvec = { version = "1", optional = true }
# direct dependency required for derive macro
bytemuck = { version = "1", features = ["derive", "must_cast"] }
smallvec = { version = "1", default-features = false }
nonmax = "0.5"
static_assertions = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
offset-allocator = "0.2"
arrayvec = { version = "0.7", default-features = false }
indexmap = { version = "2" }
wgpu-types = "30"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
features = ["hearth_image/zstd_rust"]

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
constants = { path = "../../constants" }
hearth_render = { path = "../hearth_render" }
hearth_core_pipeline = { path = "../hearth_core_pipeline" }
