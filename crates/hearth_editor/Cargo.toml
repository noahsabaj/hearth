[package]
name = "hearth_editor"
version = "0.20.0-dev"
edition = "2024"
description = "The Hearth editor: scenes, a 3D viewport, and a live link to the running game"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth", "editor"]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev" }
hearth_camera = { path = "../hearth_camera", version = "0.20.0-dev" }
hearth_camera_controller = { path = "../hearth_camera_controller", version = "0.20.0-dev", features = [
  "free_camera",
] }
hearth_color = { path = "../hearth_color", version = "0.20.0-dev" }
hearth_dev_tools = { path = "../hearth_dev_tools", version = "0.20.0-dev", features = [
  "render",
] }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }
hearth_feathers = { path = "../hearth_feathers", version = "0.20.0-dev" }
hearth_gizmos = { path = "../hearth_gizmos", version = "0.20.0-dev" }
hearth_gltf = { path = "../hearth_gltf", version = "0.20.0-dev" }
hearth_input = { path = "../hearth_input", version = "0.20.0-dev" }
hearth_input_focus = { path = "../hearth_input_focus", version = "0.20.0-dev" }
hearth_inspector = { path = "../hearth_inspector", version = "0.20.0-dev", features = [
  "remote",
] }
hearth_light = { path = "../hearth_light", version = "0.20.0-dev" }
hearth_log = { path = "../hearth_log", version = "0.20.0-dev" }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev" }
hearth_mesh = { path = "../hearth_mesh", version = "0.20.0-dev" }
hearth_pbr = { path = "../hearth_pbr", version = "0.20.0-dev" }
hearth_picking = { path = "../hearth_picking", version = "0.20.0-dev", features = [
  "mesh_picking",
] }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev" }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev" }
hearth_render = { path = "../hearth_render", version = "0.20.0-dev" }
hearth_remote = { path = "../hearth_remote", version = "0.20.0-dev", default-features = false, features = [
  "http",
  "hearth_asset",
  "hearth_render",
] }
hearth_scene = { path = "../hearth_scene", version = "0.20.0-dev" }
hearth_shape = { path = "../hearth_shape", version = "0.20.0-dev" }
hearth_tasks = { path = "../hearth_tasks", version = "0.20.0-dev" }
hearth_text = { path = "../hearth_text", version = "0.20.0-dev" }
hearth_time = { path = "../hearth_time", version = "0.20.0-dev" }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev" }
hearth_ui = { path = "../hearth_ui", version = "0.20.0-dev" }
hearth_ui_widgets = { path = "../hearth_ui_widgets", version = "0.20.0-dev" }
hearth_window = { path = "../hearth_window", version = "0.20.0-dev" }
# `hearth_feathers` gives `CursorIcon` its custom variant, which `hearth_winit` only handles with this.
hearth_winit = { path = "../hearth_winit", version = "0.20.0-dev", default-features = false, features = [
  "custom_cursor",
] }
hearth_world_serialization = { path = "../hearth_world_serialization", version = "0.20.0-dev" }

# other
ron = { version = "0.12", default-features = false }
serde_json = "1.0.140"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
all-features = true
