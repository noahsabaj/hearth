[package]
name = "hearth_animation"
version = "0.20.0-dev"
edition = "2024"
description = "Provides animation functionality for Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[dependencies]
# hearth
hearth_animation_macros = { path = "macros", version = "0.20.0-dev" }
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev" }
hearth_color = { path = "../hearth_color", version = "0.20.0-dev" }
hearth_curve = { path = "../hearth_curve", version = "0.20.0-dev", features = [
  "hearth_reflect",
] }
hearth_derive = { path = "../hearth_derive", version = "0.20.0-dev" }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev" }
hearth_mesh = { path = "../hearth_mesh", version = "0.20.0-dev", optional = true, features = [
  "morph",
] }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", features = [
  "petgraph",
] }
hearth_time = { path = "../hearth_time", version = "0.20.0-dev" }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev" }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
  "serialize",
] }

# other
petgraph = { version = "0.8", features = ["serde-1"] }
ron = "0.12"
serde = "1"
blake3 = { version = "1.0" }
downcast-rs = { version = "2", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
either = "1.13"
thread_local = "1"
uuid = { version = "1.21.0", features = ["v4"] }
smallvec = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
bitvec = { version = "1" }

[dev-dependencies]
itertools = "0.14"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
uuid = { version = "1.21.0", default-features = false, features = ["js"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
