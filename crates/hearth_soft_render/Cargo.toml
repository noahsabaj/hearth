[package]
name = "hearth_soft_render"
version = "0.20.0-dev"
edition = "2024"
description = "Draws Hearth's 2D scenes on the CPU, into a framebuffer for each window"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[features]
## Shows each window's framebuffer in it, on Windows, macOS, X11 and Wayland, through softbuffer.
desktop = ["dep:softbuffer"]
## Draws `Text2d`.
hearth_text = ["dep:hearth_text", "hearth_sprite/hearth_text"]
## Draws each camera's UI.
hearth_ui = ["dep:hearth_ui", "dep:hearth_input_focus", "hearth_text"]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev" }
hearth_camera = { path = "../hearth_camera", version = "0.20.0-dev" }
hearth_color = { path = "../hearth_color", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }
hearth_image = { path = "../hearth_image", version = "0.20.0-dev" }
hearth_input_focus = { path = "../hearth_input_focus", version = "0.20.0-dev", optional = true }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev" }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev" }
hearth_sprite = { path = "../hearth_sprite", version = "0.20.0-dev" }
hearth_tasks = { path = "../hearth_tasks", version = "0.20.0-dev" }
hearth_text = { path = "../hearth_text", version = "0.20.0-dev", optional = true }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev" }
hearth_ui = { path = "../hearth_ui", version = "0.20.0-dev", optional = true }
hearth_window = { path = "../hearth_window", version = "0.20.0-dev" }

# other
bytemuck = "1"
softbuffer = { version = "0.4.8", optional = true, default-features = false, features = [
  "x11",
  "x11-dlopen",
  "wayland",
  "wayland-dlopen",
] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
