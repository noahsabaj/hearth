[package]
name = "hearth_annotations"
version = "0.20.0-dev"
edition = "2024"
description = "Well-known reflection annotations for Hearth tools such as inspectors and editors"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[dependencies]
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
