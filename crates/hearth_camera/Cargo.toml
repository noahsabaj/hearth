[package]
name = "hearth_camera"
version = "0.20.0-dev"
edition = "2024"
description = "Provides a camera abstraction for Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev" }
hearth_image = { path = "../hearth_image", version = "0.20.0-dev" }
hearth_mesh = { path = "../hearth_mesh", version = "0.20.0-dev" }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev" }
hearth_shape = { path = "../hearth_shape", version = "0.20.0-dev" }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", features = [
  "wgpu-types",
] }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev" }
hearth_derive = { path = "../hearth_derive", version = "0.20.0-dev" }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev" }
hearth_color = { path = "../hearth_color", version = "0.20.0-dev", features = [
  "serialize",
] }
hearth_window = { path = "../hearth_window", version = "0.20.0-dev" }

# other
wgpu-types = { version = "30", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }
downcast-rs = { version = "2", default-features = false, features = ["std"] }
derive_more = { version = "2", default-features = false, features = ["from"] }
smallvec = { version = "1", default-features = false, features = ["const_new"] }

[dev-dependencies]
hearth_scene = { path = "../hearth_scene", version = "0.20.0-dev" }

[features]
default = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
