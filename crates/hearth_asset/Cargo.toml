[package]
name = "hearth_asset"
version = "0.20.0-dev"
edition = "2024"
description = "Provides asset functionality for Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
file_watcher = ["notify-debouncer-full", "watch", "multi_threaded"]
embedded_watcher = ["file_watcher"]
multi_threaded = ["hearth_tasks/multi_threaded"]
http = ["blocking", "ureq"]
https = ["blocking", "ureq", "ureq/rustls", "ureq/platform-verifier"]
web_asset_cache = []
asset_processor = []
watch = []
trace = []

[dependencies]
hearth_app = { path = "../hearth_app", version = "0.20.0-dev", default-features = false, features = [
  "hearth_reflect",
] }
hearth_asset_macros = { path = "macros", version = "0.20.0-dev" }
hearth_diagnostic = { path = "../hearth_diagnostic", version = "0.20.0-dev", default-features = false }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev", default-features = false }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", default-features = false, features = [
  "uuid",
] }
hearth_tasks = { path = "../hearth_tasks", version = "0.20.0-dev", default-features = false, features = [
  "async_executor",
] }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev", default-features = false }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
] }

stackfuture = { version = "0.3", default-features = false }
atomicow = { version = "1.1", default-features = false, features = ["std"] }
async-broadcast = { version = "0.7.2", default-features = false }
async-fs = { version = "2.0", default-features = false }
async-lock = { version = "3.0", default-features = false }
bitflags = { version = "2.3", default-features = false }
async-channel = { version = "2", default-features = false }
crossbeam-channel = { version = "0.5", default-features = false, features = [
  "std",
] }
downcast-rs = { version = "2", default-features = false }
disqualified = { version = "1.0", default-features = false }
either = { version = "1.13", default-features = false }
futures-util = { version = "0.3", default-features = false, features = [
  "async-await-macro",
  "alloc",
] }
futures-io = { version = "0.3", default-features = false }
futures-lite = { version = "2.0.1", default-features = false }
blake3 = { version = "1.8", default-features = false }
ron = { version = "0.12", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
uuid = { version = "1.21.0", default-features = false, features = [
  "v4",
  "serde",
] }
tracing = { version = "0.1", default-features = false }

[target.'cfg(not(any(target_os = "windows", target_arch = "wasm32")))'.dependencies]
async-io = "2.6"

[target.'cfg(target_os = "android")'.dependencies]
hearth_android = { path = "../hearth_android", version = "0.20.0-dev", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
wasm-bindgen = { version = "0.2" }
web-sys = { version = "0.3", features = [
  "Window",
  "Response",
  "WorkerGlobalScope",
] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
uuid = { version = "1.21.0", default-features = false, features = ["js"] }
hearth_app = { path = "../hearth_app", version = "0.20.0-dev", default-features = false, features = [
  "web",
] }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", default-features = false, features = [
  "web",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify-debouncer-full = { version = "0.7.0", default-features = false, optional = true }
# updating ureq: while ureq is semver stable, it depends on rustls which is not, meaning unlikely but possible breaking changes on minor releases. upstream PR #16366
ureq = { version = "3", optional = true, default-features = false }
blocking = { version = "1.6", optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
