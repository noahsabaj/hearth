[package]
name = "hearth_input"
version = "0.20.0-dev"
edition = "2024"
description = "Provides input functionality for Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[features]
default = ["std", "hearth_reflect", "hearth_ecs/async_executor", "smol_str"]

# Functionality

## Input sources
mouse = []
keyboard = []
gamepad = []
touch = []
gestures = []

## Adds runtime reflection support using `hearth_reflect`.
hearth_reflect = [
  "dep:hearth_reflect",
  "hearth_app/hearth_reflect",
  "hearth_ecs/hearth_reflect",
  "hearth_math/hearth_reflect",
]

## Adds serialization support through `serde`.
serialize = [
  "serde",
  "smol_str?/serde",
  "hearth_ecs/serialize",
  "hearth_math/serialize",
  "hearth_platform/serialize",
]

## Uses the small-string optimization provided by `smol_str`.
smol_str = ["dep:smol_str", "hearth_reflect/smol_str"]

# Platform Compatibility

## Allows access to the `std` crate. Enabling this feature will prevent compilation
## on `no_std` targets, but provides access to certain additional features on
## supported platforms.
std = [
  "hearth_app/std",
  "hearth_ecs/std",
  "hearth_math/std",
  "hearth_reflect/std",
  "hearth_platform/std",
]

## `critical-section` provides the building blocks for synchronization primitives
## on all platforms, including `no_std`.
critical-section = [
  "hearth_app/critical-section",
  "hearth_ecs/critical-section",
  "hearth_reflect?/critical-section",
  "hearth_platform/critical-section",
]

## Uses the `libm` maths library instead of the one provided in `std` and `core`.
libm = ["hearth_math/libm"]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev", default-features = false }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev", default-features = false }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev", default-features = false }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", features = [
  "glam",
], default-features = false, optional = true }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev", default-features = false }

# other
serde = { version = "1", features = [
  "alloc",
  "derive",
], default-features = false, optional = true }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
smol_str = { version = "0.2", default-features = false, optional = true }
log = { version = "0.4", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
