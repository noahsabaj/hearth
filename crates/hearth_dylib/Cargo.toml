[package]
name = "hearth_dylib"
version = "0.20.0-dev"
edition = "2024"
description = "Force the Hearth Engine to be dynamically linked for faster linking"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[lib]
crate-type = ["dylib"]

[dependencies]
hearth_internal = { path = "../hearth_internal", version = "0.20.0-dev", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
