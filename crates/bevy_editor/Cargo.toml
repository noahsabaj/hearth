[package]
name = "bevy_editor"
version = "0.20.0-dev"
edition = "2024"
description = "The Hearth editor: scenes, a 3D viewport, and a live link to the running game"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "editor"]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_asset = { path = "../bevy_asset", version = "0.20.0-dev" }
bevy_camera = { path = "../bevy_camera", version = "0.20.0-dev" }
bevy_camera_controller = { path = "../bevy_camera_controller", version = "0.20.0-dev", features = [
  "free_camera",
] }
bevy_color = { path = "../bevy_color", version = "0.20.0-dev" }
bevy_dev_tools = { path = "../bevy_dev_tools", version = "0.20.0-dev", features = [
  "render",
] }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev" }
bevy_feathers = { path = "../bevy_feathers", version = "0.20.0-dev" }
bevy_gizmos = { path = "../bevy_gizmos", version = "0.20.0-dev" }
bevy_gltf = { path = "../bevy_gltf", version = "0.20.0-dev" }
bevy_input = { path = "../bevy_input", version = "0.20.0-dev" }
bevy_input_focus = { path = "../bevy_input_focus", version = "0.20.0-dev" }
bevy_inspector = { path = "../bevy_inspector", version = "0.20.0-dev", features = [
  "remote",
] }
bevy_light = { path = "../bevy_light", version = "0.20.0-dev" }
bevy_log = { path = "../bevy_log", version = "0.20.0-dev" }
bevy_math = { path = "../bevy_math", version = "0.20.0-dev" }
bevy_mesh = { path = "../bevy_mesh", version = "0.20.0-dev" }
bevy_pbr = { path = "../bevy_pbr", version = "0.20.0-dev" }
bevy_picking = { path = "../bevy_picking", version = "0.20.0-dev", features = [
  "mesh_picking",
] }
bevy_platform = { path = "../bevy_platform", version = "0.20.0-dev" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0-dev" }
bevy_render = { path = "../bevy_render", version = "0.20.0-dev" }
bevy_remote = { path = "../bevy_remote", version = "0.20.0-dev", default-features = false, features = [
  "http",
  "bevy_asset",
  "bevy_render",
] }
bevy_scene = { path = "../bevy_scene", version = "0.20.0-dev" }
bevy_shape = { path = "../bevy_shape", version = "0.20.0-dev" }
bevy_tasks = { path = "../bevy_tasks", version = "0.20.0-dev" }
bevy_text = { path = "../bevy_text", version = "0.20.0-dev" }
bevy_time = { path = "../bevy_time", version = "0.20.0-dev" }
bevy_transform = { path = "../bevy_transform", version = "0.20.0-dev" }
bevy_ui = { path = "../bevy_ui", version = "0.20.0-dev" }
bevy_ui_widgets = { path = "../bevy_ui_widgets", version = "0.20.0-dev" }
bevy_window = { path = "../bevy_window", version = "0.20.0-dev" }
# `bevy_feathers` gives `CursorIcon` its custom variant, which `bevy_winit` only handles with this.
bevy_winit = { path = "../bevy_winit", version = "0.20.0-dev", default-features = false, features = [
  "custom_cursor",
] }
bevy_world_serialization = { path = "../bevy_world_serialization", version = "0.20.0-dev" }

# other
ron = { version = "0.12", default-features = false }
serde_json = "1.0.140"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
all-features = true
