[package]
description = "Provides curve functionality for Hearth Engine"
edition = "2024"
homepage = "https://github.com/noahsabaj/hearth"
keywords = ["hearth"]
license = "MIT OR Apache-2.0"
name = "hearth_curve"
repository = "https://github.com/noahsabaj/hearth"
rust-version = "1.94.0"
version = "0.20.0-dev"

[dependencies]
hearth_math = { path = "../hearth_math", version = "0.20.0-dev", default-features = false, features = [
  "approx",
] }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", default-features = false, optional = true }

itertools = { version = "0.14.0", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }
approx = { version = "0.5", default-features = false, optional = true }
variadics_please = "2.0"

[dev-dependencies]
approx = "0.5"
# Enable the approx feature when testing.
hearth_math = { path = "../hearth_math", version = "0.20.0-dev", default-features = false, features = [
  "approx",
] }

[features]
alloc = ["itertools/use_alloc", "serde?/alloc"]
default = ["std"]
std = [
  "alloc",
  "approx?/std",
  "hearth_math/std",
  "hearth_reflect?/std",
  "itertools/use_std",
  "serde?/std",
]

serialize = ["hearth_math/serialize", "dep:serde"]
# Enable approx for hearth_math types to approximate floating point equality comparisons and assertions
approx = ["hearth_math/approx", "dep:approx"]
# Enable hearth_reflect (requires alloc)
hearth_reflect = ["alloc", "hearth_math/hearth_reflect", "dep:hearth_reflect"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "--generate-link-to-definition",
  "--generate-macro-expansion",
  "-Zunstable-options",
]
