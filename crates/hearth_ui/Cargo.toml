[package]
name = "hearth_ui"
version = "0.20.0-dev"
edition = "2024"
description = "A custom ECS-driven UI framework built specifically for Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[dependencies]
# hearth
hearth_a11y = { path = "../hearth_a11y", version = "0.20.0-dev" }
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev" }
hearth_camera = { path = "../hearth_camera", version = "0.20.0-dev" }
hearth_color = { path = "../hearth_color", version = "0.20.0-dev" }
hearth_derive = { path = "../hearth_derive", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }
hearth_image = { path = "../hearth_image", version = "0.20.0-dev" }
hearth_input = { path = "../hearth_input", version = "0.20.0-dev" }
hearth_input_focus = { path = "../hearth_input_focus", version = "0.20.0-dev" }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev" }
hearth_log = { path = "../hearth_log", version = "0.20.0-dev" }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev" }
hearth_sprite = { path = "../hearth_sprite", version = "0.20.0-dev", features = [
  "hearth_text",
] }
hearth_time = { path = "../hearth_time", version = "0.20.0-dev" }
hearth_text = { path = "../hearth_text", version = "0.20.0-dev" }
hearth_picking = { path = "../hearth_picking", version = "0.20.0-dev", optional = true }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev" }
hearth_window = { path = "../hearth_window", version = "0.20.0-dev" }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev" }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
] }

# other
taffy = { version = "0.14", default-features = false, features = [
  "std",
  "block_layout",
  "flexbox",
  "grid",
  "content_size",
] }
serde = { version = "1", features = ["derive"], optional = true }
uuid = { version = "1.21.0", features = ["v4"], optional = true }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
smallvec = { version = "1", default-features = false }
accesskit = "0.25"
parley = { version = "0.11.0", default-features = false, features = ["std"] }
swash = { version = "0.2.6" }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
hearth_core_pipeline = { path = "../hearth_core_pipeline", version = "0.20.0-dev" }

[features]
default = []
serialize = [
  "serde",
  "smallvec/serde",
  "hearth_math/serialize",
  "hearth_platform/serialize",
]
hearth_picking = ["dep:hearth_picking", "dep:uuid"]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
