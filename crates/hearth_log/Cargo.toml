[package]
name = "hearth_log"
version = "0.20.0-dev"
edition = "2024"
description = "Provides logging for Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[features]
trace = ["tracing-error"]
trace_tracy_memory = ["dep:tracy-client"]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev" }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }

# other
tracing-subscriber = { version = "0.3.20", features = [
  "registry",
  "env-filter",
] }
tracing-chrome = { version = "0.7.0", optional = true }
tracing-log = "0.2.0"
tracing-error = { version = "0.2.0", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Tracy dependency compatibility table:
# https://github.com/nagisa/rust_tracy_client
tracing-tracy = { version = "0.12.0", optional = true }
tracy-client = { version = "0.19.0", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-wasm = "0.2.1"
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
hearth_app = { path = "../hearth_app", version = "0.20.0-dev", default-features = false, features = [
  "web",
] }

[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.3"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
