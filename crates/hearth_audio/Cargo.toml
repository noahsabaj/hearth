[package]
name = "hearth_audio"
version = "0.20.0-dev"
edition = "2024"
description = "Provides audio functionality for Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev" }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev" }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev" }

# other
rodio = { version = "0.22", default-features = false, features = [
  "playback",
  "tracing",
] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
rodio = { version = "0.22", default-features = false, features = [
  "wasm-bindgen",
  "playback",
] }
hearth_app = { path = "../hearth_app", version = "0.20.0-dev", default-features = false, features = [
  "web",
] }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", default-features = false, features = [
  "web",
] }

[features]
aac = ["rodio/symphonia-aac"]
flac = ["rodio/claxon"]
mp3 = ["rodio/mp3"]
mp4 = ["rodio/mp4"]
vorbis = ["rodio/lewton"]
wav = ["rodio/hound"]
symphonia-flac = ["rodio/flac"]
symphonia-vorbis = ["rodio/vorbis"]
symphonia-wav = ["rodio/wav"]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
