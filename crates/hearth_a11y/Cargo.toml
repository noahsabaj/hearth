[package]
name = "hearth_a11y"
version = "0.20.0-dev"
edition = "2024"
description = "Provides accessibility support for Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth", "accessibility", "a11y"]

[features]
default = ["std", "hearth_reflect", "hearth_ecs/async_executor"]

# Functionality

## Adds runtime reflection support using `hearth_reflect`.
hearth_reflect = [
  "dep:hearth_reflect",
  "hearth_app/hearth_reflect",
  "hearth_ecs/hearth_reflect",
]

## Adds serialization support through `serde`.
serialize = ["dep:serde", "hearth_ecs/serialize", "accesskit/serde"]

# Platform Compatibility

## Allows access to the `std` crate. Enabling this feature will prevent compilation
## on `no_std` targets, but provides access to certain additional features on
## supported platforms.
std = ["hearth_app/std", "hearth_ecs/std", "hearth_reflect/std"]

## `critical-section` provides the building blocks for synchronization primitives
## on all platforms, including `no_std`.
critical-section = [
  "hearth_app/critical-section",
  "hearth_ecs/critical-section",
  "hearth_reflect?/critical-section",
]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev", default-features = false }
hearth_derive = { path = "../hearth_derive", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev", default-features = false }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", default-features = false, optional = true }

# other
accesskit = { version = "0.25", default-features = false }
serde = { version = "1", default-features = false, features = [
  "alloc",
], optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
