[package]
name = "hearth_dev_tools"
version = "0.20.0-dev"
edition = "2024"
description = "Collection of developer tools for the Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[features]
hearth_audio = ["dep:hearth_audio"]
hearth_ci_testing = ["dep:serde", "dep:ron", "dep:hearth_render"]
screenrecording = ["dep:x264", "render"]
render = [
  "dep:hearth_render",
  "dep:hearth_core_pipeline",
  "dep:hearth_pbr",
  "dep:hearth_ui_render",
]
webgl = ["dep:hearth_render", "hearth_render?/webgl"]
webgpu = ["dep:hearth_render", "hearth_render?/webgpu"]
schedule_data = ["dep:serde", "dep:ron", "dep:thiserror"]
serialize = [
  "dep:serde",
  "dep:serde_json",
  "hearth_ecs/serialize",
  "hearth_platform/serialize",
  "hearth_utils/serialize",
]

[dependencies]
# hearth
hearth_animation = { path = "../hearth_animation", version = "0.20.0-dev" }
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_audio = { path = "../hearth_audio", version = "0.20.0-dev", optional = true }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev" }
hearth_camera = { path = "../hearth_camera", version = "0.20.0-dev" }
hearth_color = { path = "../hearth_color", version = "0.20.0-dev" }
hearth_core_pipeline = { path = "../hearth_core_pipeline", version = "0.20.0-dev", optional = true }
hearth_diagnostic = { path = "../hearth_diagnostic", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }
hearth_extract = { path = "../hearth_extract", version = "0.20.0-dev" }
hearth_image = { path = "../hearth_image", version = "0.20.0-dev" }
hearth_input = { path = "../hearth_input", version = "0.20.0-dev" }
hearth_light = { path = "../hearth_light", version = "0.20.0-dev" }
hearth_log = { path = "../hearth_log", version = "0.20.0-dev" }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev" }
hearth_pbr = { path = "../hearth_pbr", version = "0.20.0-dev", optional = true }
hearth_picking = { path = "../hearth_picking", version = "0.20.0-dev" }
hearth_render = { path = "../hearth_render", version = "0.20.0-dev", optional = true }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev" }
hearth_time = { path = "../hearth_time", version = "0.20.0-dev" }
hearth_text = { path = "../hearth_text", version = "0.20.0-dev" }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev" }
hearth_shader = { path = "../hearth_shader", version = "0.20.0-dev" }
hearth_sprite = { path = "../hearth_sprite", version = "0.20.0-dev" }
hearth_ui = { path = "../hearth_ui", version = "0.20.0-dev" }
hearth_ui_render = { path = "../hearth_ui_render", version = "0.20.0-dev", optional = true }
hearth_ui_widgets = { path = "../hearth_ui_widgets", version = "0.20.0-dev" }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev" }
hearth_window = { path = "../hearth_window", version = "0.20.0-dev" }
hearth_state = { path = "../hearth_state", version = "0.20.0-dev" }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev" }
hearth_mesh = { path = "../hearth_mesh", version = "0.20.0-dev" }
hearth_world_serialization = { path = "../hearth_world_serialization", version = "0.20.0-dev" }

# other
thiserror = { version = "2.0", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", default-features = false, features = [
  "alloc",
], optional = true }
ron = { version = "0.12", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
strsim = { version = "0.11", default-features = false }

[dev-dependencies]
# Allow tests to depend on the names of systems.
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev", features = [
  "debug",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
x264 = { version = "0.5.0", optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
hearth_render = { path = "../hearth_render" }
hearth_pbr = { path = "../hearth_pbr" }
hearth_ui_render = { path = "../hearth_ui_render" }
hearth_core_pipeline = { path = "../hearth_core_pipeline" }
