[package]
name = "hearth_color"
version = "0.20.0-dev"
edition = "2024"
description = "Types for representing and manipulating color values"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth", "color"]
rust-version = "1.85.0"

[dependencies]
hearth_curve = { path = "../hearth_curve", default-features = false, version = "0.20.0-dev" }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev", default-features = false }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", default-features = false, optional = true }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1.0", features = [
  "derive",
], default-features = false, optional = true }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
wgpu-types = { version = "30", default-features = false, optional = true }
encase = { version = "0.13", default-features = false, optional = true }

[features]
default = ["std", "hearth_reflect", "encase"]
std = [
  "alloc",
  "hearth_math/std",
  "hearth_curve/std",
  "serde?/std",
  "wgpu-types?/std",
  "hearth_reflect?/std",
]
alloc = ["hearth_math/alloc", "hearth_curve/alloc", "serde?/alloc"]
serialize = ["serde", "hearth_math/serialize", "hearth_curve/serialize"]
hearth_reflect = ["dep:hearth_reflect"]
wgpu-types = ["dep:wgpu-types"]
encase = ["dep:encase", "std"]
libm = ["hearth_math/libm"]
critical-section = ["hearth_reflect?/critical-section"]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
