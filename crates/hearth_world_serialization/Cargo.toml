[package]
name = "hearth_world_serialization"
version = "0.20.0-dev"
edition = "2024"
description = "Provides ECS World serialization functionality for Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[features]
default = ["serialize"]
serialize = [
  "dep:ron",
  "dep:serde",
  "uuid/serde",
  "hearth_ecs/serialize",
  "hearth_platform/serialize",
]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev" }
hearth_derive = { path = "../hearth_derive", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev" }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev" }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev" }
hearth_camera = { path = "../hearth_camera", version = "0.20.0-dev" }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
] }

# other
ron = { version = "0.12", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
uuid = { version = "1.21.0", features = ["v4"] }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
uuid = { version = "1.21.0", default-features = false, features = ["js"] }

[dev-dependencies]
postcard = { version = "1.0", features = ["alloc"] }
rmp-serde = "1.1"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
