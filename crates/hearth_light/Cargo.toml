[package]
name = "hearth_light"
version = "0.20.0-dev"
edition = "2024"
description = "Keeps the lights on at Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_curve = { path = "../hearth_curve", version = "0.20.0-dev" }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev" }
hearth_image = { path = "../hearth_image", version = "0.20.0-dev" }
hearth_mesh = { path = "../hearth_mesh", version = "0.20.0-dev" }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev" }
hearth_shape = { path = "../hearth_shape", version = "0.20.0-dev" }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev" }
hearth_camera = { path = "../hearth_camera", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev" }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev" }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev" }
hearth_color = { path = "../hearth_color", version = "0.20.0-dev", features = [
  "serialize",
] }
hearth_gizmos = { path = "../hearth_gizmos", version = "0.20.0-dev", optional = true }
hearth_log = { path = "../hearth_log", version = "0.20.0-dev" }

# other
tracing = { version = "0.1", default-features = false }
wgpu-types = { version = "30", default-features = false }
half = "2.7.1"
smallvec = { version = "1", default-features = false }

[features]
default = []
experimental_pbr_pcss = []
webgl = []
webgpu = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
