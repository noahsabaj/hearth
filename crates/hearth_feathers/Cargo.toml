[package]
name = "hearth_feathers"
version = "0.20.0-dev"
edition = "2024"
description = "A collection of UI widgets for building editors and utilities in Hearth"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[dependencies]
# hearth
hearth_a11y = { path = "../hearth_a11y", version = "0.20.0-dev" }
hearth_app = { path = "../hearth_app", version = "0.20.0-dev" }
hearth_asset = { path = "../hearth_asset", version = "0.20.0-dev" }
hearth_camera = { path = "../hearth_camera", version = "0.20.0-dev" }
hearth_color = { path = "../hearth_color", version = "0.20.0-dev" }
hearth_ui_widgets = { path = "../hearth_ui_widgets", version = "0.20.0-dev" }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev" }
hearth_input = { path = "../hearth_input", version = "0.20.0-dev" }
hearth_input_focus = { path = "../hearth_input_focus", version = "0.20.0-dev", features = [
  "hearth_picking",
] }
hearth_log = { path = "../hearth_log", version = "0.20.0-dev" }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev" }
hearth_picking = { path = "../hearth_picking", version = "0.20.0-dev", features = [
  "custom_cursor",
] }
hearth_shader = { path = "../hearth_shader", version = "0.20.0-dev" }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev" }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev" }
hearth_render = { path = "../hearth_render", version = "0.20.0-dev" }
hearth_scene = { path = "../hearth_scene", version = "0.20.0-dev" }
hearth-settings = { path = "../hearth_settings", version = "0.20.0-dev", optional = true }
hearth_text = { path = "../hearth_text", version = "0.20.0-dev" }
hearth_ui = { path = "../hearth_ui", version = "0.20.0-dev", features = [
  "hearth_picking",
] }
hearth_ui_render = { path = "../hearth_ui_render", version = "0.20.0-dev" }
hearth_window = { path = "../hearth_window", version = "0.20.0-dev" }
hearth_derive = { path = "../hearth_derive", version = "0.20.0-dev" }
smol_str = { version = "0.2", default-features = false }

# other
accesskit = "0.25"

[features]
default = []
hearth_settings = ["dep:hearth-settings"]
webgl = []
webgpu = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
hearth_render = { path = "../hearth_render" }
hearth_ui_render = { path = "../hearth_ui_render" }
