[package]
name = "hearth_transform"
version = "0.20.0-dev"
edition = "2024"
description = "Provides transform functionality for Hearth Engine"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[dependencies]
# hearth
hearth_app = { path = "../hearth_app", version = "0.20.0-dev", default-features = false, optional = true }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev", default-features = false, optional = true }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev", default-features = false }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", default-features = false, optional = true }
hearth_tasks = { path = "../hearth_tasks", version = "0.20.0-dev", default-features = false }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false, optional = true }
derive_more = { version = "2", default-features = false, features = ["from"] }

[dev-dependencies]
hearth_tasks = { path = "../hearth_tasks", version = "0.20.0-dev" }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev", default-features = false, features = [
  "approx",
] }
approx = "0.5.1"
ron = "0.12"

[features]
# Turning off default features leaves you with a barebones
# definition of transform.
default = ["std", "hearth-support", "hearth_reflect", "async_executor"]

# Functionality

## Enables multithreading support. Schedules will attempt to run systems on
## multiple threads whenever possible.
multi_threaded = ["hearth_tasks/multi_threaded"]

## Adds normal Hearth impls like deriving components, bundles, reflection, as well as adding
## systems for transform propagation and more.
## This exists because it allows opting out of all of this, leaving only a bare-bones transform struct,
## which enables users to depend on that without needing the larger Hearth dependency tree.
hearth-support = ["alloc", "dep:hearth_app", "dep:hearth_ecs"]

## Adds serialization support through `serde`.
serialize = ["dep:serde", "hearth_math/serialize"]

## Adds runtime reflection support using `hearth_reflect`.
hearth_reflect = [
  "hearth-support",
  "dep:hearth_reflect",
  "hearth_math/hearth_reflect",
  "hearth_ecs/hearth_reflect",
  "hearth_app/hearth_reflect",
]

# Debugging Features

## Enables `tracing` integration, allowing spans and other metrics to be reported
## through that framework.
trace = ["std", "dep:tracing"]

# Executor Backend

## Uses `async-executor` as a task execution backend.
## This backend is incompatible with `no_std` targets.
async_executor = ["std", "hearth_tasks/async_executor"]

# Platform Compatibility

## Allows access to the `std` crate. Enabling this feature will prevent compilation
## on `no_std` targets, but provides access to certain additional features on
## supported platforms.
std = [
  "alloc",
  "hearth_app?/std",
  "hearth_ecs?/std",
  "hearth_math/std",
  "hearth_reflect?/std",
  "hearth_utils/parallel",
  "hearth_utils/buffered_channel",
  "serde?/std",
]

## `critical-section` provides the building blocks for synchronization primitives
## on all platforms, including `no_std`.
critical-section = [
  "hearth_app?/critical-section",
  "hearth_ecs?/critical-section",
  "hearth_reflect?/critical-section",
]

## Allows access to the `alloc` crate.
alloc = ["serde?/alloc"]

## Uses the `libm` maths library instead of the one provided in `std` and `core`.
libm = ["hearth_math/libm"]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
