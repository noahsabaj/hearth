[package]
name = "hearth_android"
version = "0.20.0-dev"
edition = "2024"
description = "Provides android functionality for Hearth Engine."
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth"]

[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6"

[features]
default = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
