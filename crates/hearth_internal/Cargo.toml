[package]
name = "hearth_internal"
version = "0.20.0-dev"
edition = "2024"
description = "An internal Hearth crate used to facilitate optional dynamic linking via the 'dynamic_linking' feature"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["game", "engine", "gamedev", "graphics", "hearth"]
categories = ["game-engines", "graphics", "gui", "rendering"]

[features]
trace = [
  "hearth_anti_alias?/trace",
  "hearth_app/trace",
  "hearth_asset?/trace",
  "hearth_core_pipeline?/trace",
  "hearth_ecs/trace",
  "hearth_extract/trace",
  "hearth_log/trace",
  "hearth_pbr?/trace",
  "hearth_post_process?/trace",
  "hearth_render?/trace",
  "hearth_transform/trace",
  "hearth_winit?/trace",
]
trace_chrome = ["hearth_log/tracing-chrome"]
trace_tracy = ["hearth_render?/tracing-tracy", "hearth_log/tracing-tracy"]
trace_tracy_memory = ["hearth_log/trace_tracy_memory", "trace", "trace_tracy"]
detailed_trace = ["hearth_ecs/detailed_trace", "hearth_render?/detailed_trace"]

sysinfo_plugin = ["hearth_diagnostic/sysinfo_plugin"]

# Texture compression asset processor (cross-platform, transcodes to any GPU format at load time)
compressed_image_saver_universal = [
  "hearth_image/compressed_image_saver_universal",
]

# Texture compression asset processor (BCn for desktop, ASTC for mobile via env var)
compressed_image_saver = ["hearth_image/compressed_image_saver"]

# Equirectangular (lat-long) panorama to cubemap conversion
equirectangular_cubemap = ["hearth_image/equirectangular_cubemap"]

# For ktx2 supercompression
zlib = ["hearth_image/zlib"]
zstd = ["hearth_image/zstd"]
zstd_rust = ["hearth_image/zstd_rust"]
zstd_c = ["hearth_image/zstd_c"]

# Image format support (HDR and PNG enabled by default)
basis-universal = ["hearth_image/basis-universal"]
bmp = ["hearth_image/bmp"]
ff = ["hearth_image/ff"]
gif = ["hearth_image/gif"]
ico = ["hearth_image/ico"]
jpeg = ["hearth_image/jpeg"]
png = ["hearth_image/png"]
pnm = ["hearth_image/pnm"]
qoi = ["hearth_image/qoi"]
tga = ["hearth_image/tga"]
tiff = ["hearth_image/tiff"]
webp = ["hearth_image/webp"]
dds = ["hearth_image/dds"]
exr = ["hearth_image/exr"]
hdr = ["hearth_image/hdr"]
ktx2 = ["hearth_image/ktx2"]

# Enable SPIR-V passthrough
spirv_shader_passthrough = ["hearth_render/spirv_shader_passthrough"]

# Statically linked DXC shader compiler for DirectX 12
# TODO: When wgpu switches to DirectX 12 instead of Vulkan by default on windows, make this a default feature
statically-linked-dxc = ["hearth_render/statically-linked-dxc"]

# Forces the wgpu instance to be initialized using the raw Vulkan HAL, enabling additional configuration
raw_vulkan_init = ["hearth_render/raw_vulkan_init"]

# Pre-populate buffer labels with buffer types for debugging.
type_label_buffers = ["hearth_render/type_label_buffers"]

# Include tonemapping LUT KTX2 files.
tonemapping_luts = [
  "hearth_core_pipeline?/tonemapping_luts",
  "ktx2",
  "hearth_image/zstd",
]

# Include SMAA LUT KTX2 Files
smaa_luts = ["hearth_anti_alias?/smaa_luts", "ktx2", "hearth_image/zstd"]

# Include Bluenoise texture for environment map generation.
bluenoise_texture = ["hearth_pbr?/bluenoise_texture", "ktx2", "hearth_image/zstd"]

# Include a preintegrated BRDF Look Up Table for more accurate specular shading.
dfg_lut = ["hearth_pbr?/dfg_lut", "ktx2", "hearth_image/zstd"]

# Include Look Up Tables that are required for area lights.
area_light_luts = ["hearth_pbr?/area_light_luts", "ktx2", "hearth_image/zstd"]

# NVIDIA Deep Learning Super Sampling
dlss = ["hearth_anti_alias/dlss", "hearth_solari?/dlss"]

# Forcibly disable DLSS so that `cargo build --all-features` works without the DLSS SDK being installed. Not meant for users.
force_disable_dlss = [
  "hearth_anti_alias?/force_disable_dlss",
  "hearth_solari?/force_disable_dlss",
]

# Audio format support (vorbis is enabled by default)
flac = ["hearth_audio/flac"]
mp3 = ["hearth_audio/mp3"]
mp4 = ["hearth_audio/mp4"]
vorbis = ["hearth_audio/vorbis"]
wav = ["hearth_audio/wav"]
aac = ["hearth_audio/aac"]
symphonia-flac = ["hearth_audio/symphonia-flac"]
symphonia-vorbis = ["hearth_audio/symphonia-vorbis"]
symphonia-wav = ["hearth_audio/symphonia-wav"]

# Shader formats
shader_format_spirv = ["hearth_render?/shader_format_spirv"]

serialize = [
  "hearth_a11y?/serialize",
  "hearth_color?/serialize",
  "hearth_dev_tools?/serialize",
  "hearth_ecs/serialize",
  "hearth_image?/serialize",
  "hearth_input/serialize",
  "hearth_math/serialize",
  "hearth_shape/serialize",
  "hearth_curve?/serialize",
  "hearth_world_serialization?/serialize",
  "hearth_time/serialize",
  "hearth_transform/serialize",
  "hearth_ui?/serialize",
  "hearth_ui_widgets?/serialize",
  "hearth_utils/serialize",
  "hearth_window?/serialize",
  "hearth_winit?/serialize",
  "hearth_platform/serialize",
  "hearth_render?/serialize",
]
multi_threaded = [
  "std",
  "hearth_asset?/multi_threaded",
  "hearth_ecs/multi_threaded",
  "hearth_render?/multi_threaded",
  "hearth_tasks/multi_threaded",
  "hearth_transform/multi_threaded",
]
async-io = ["std", "hearth_tasks/async-io"]

# Display server protocol support (X11 is enabled by default)
wayland = ["hearth_winit/wayland", "hearth_clipboard?/wayland"]
x11 = ["hearth_winit/x11"]

# Android activity support (choose one)
android-native-activity = ["hearth_winit/android-native-activity"]
android-game-activity = ["hearth_winit/android-game-activity"]

# Transmission textures in `StandardMaterial`:
pbr_transmission_textures = [
  "hearth_pbr?/pbr_transmission_textures",
  "hearth_gltf?/pbr_transmission_textures",
]

# Clustered Decal support
pbr_clustered_decals = ["hearth_pbr?/pbr_clustered_decals"]

# Light Texture support
pbr_light_textures = [
  "hearth_pbr?/pbr_clustered_decals",
  "hearth_pbr?/pbr_light_textures",
]

# Multi-layer material textures in `StandardMaterial`:
pbr_multi_layer_material_textures = [
  "hearth_pbr?/pbr_multi_layer_material_textures",
  "hearth_gltf?/pbr_multi_layer_material_textures",
]

# Anisotropy texture in `StandardMaterial`:
pbr_anisotropy_texture = [
  "hearth_pbr?/pbr_anisotropy_texture",
  "hearth_gltf?/pbr_anisotropy_texture",
]

# Percentage-closer soft shadows
experimental_pbr_pcss = ["hearth_pbr?/experimental_pbr_pcss"]

# Specular textures in `StandardMaterial`:
pbr_specular_textures = [
  "hearth_pbr?/pbr_specular_textures",
  "hearth_gltf?/pbr_specular_textures",
]

# Optimise for WebGL2
webgl = [
  "hearth_core_pipeline?/webgl",
  "hearth_anti_alias?/webgl",
  "hearth_pbr?/webgl",
  "hearth_render?/webgl",
  "hearth_gizmos_render?/webgl",
  "hearth_sprite_render?/webgl",
  "hearth_dev_tools?/webgl",
  "hearth_post_process?/webgl",
  "hearth_feathers?/webgl",
]

webgpu = [
  "hearth_core_pipeline?/webgpu",
  "hearth_anti_alias?/webgpu",
  "hearth_pbr?/webgpu",
  "hearth_render?/webgpu",
  "hearth_gizmos_render?/webgpu",
  "hearth_sprite_render?/webgpu",
  "hearth_dev_tools?/webgpu",
  "hearth_post_process?/webgpu",
  "hearth_feathers?/webgpu",
]

# Enable systems that allow for automated testing on CI
hearth_ci_testing = ["hearth_dev_tools/hearth_ci_testing", "hearth_render?/ci_limits"]

render_dev_tools = ["hearth_dev_tools/render"]

# Enable glTF animation loading
gltf_animation = ["hearth_animation", "hearth_gltf?/hearth_animation"]

# Enables loading glTF files that use KHR_meshopt_compression or EXT_meshopt_compression
gltf_meshopt = ["hearth_gltf?/meshopt"]

# Enables support for morph target weights in hearth_mesh
morph = ["hearth_mesh?/morph", "hearth_render?/morph"]

# Enables hearth_mesh and hearth_animation morph weight support
morph_animation = ["morph", "hearth_animation?/hearth_mesh"]

hearth_extract = ["dep:hearth_extract"]
hearth_curve = ["dep:hearth_curve"]
hearth_shader = ["dep:hearth_shader"]
hearth_image = ["dep:hearth_image", "hearth_color", "hearth_asset"]
hearth_sprite = ["dep:hearth_sprite", "hearth_camera"]
hearth_text = [
  "dep:hearth_text",
  "hearth_image",
  "hearth_sprite?/hearth_text",
  "hearth_sprite_render?/hearth_text",
  "hearth_soft_render?/hearth_text",
]
hearth_ui = [
  "dep:hearth_ui",
  "hearth_text",
  "hearth_sprite",
  "hearth_soft_render?/hearth_ui",
]
hearth_mesh = ["dep:hearth_mesh", "hearth_image", "hearth_gizmos?/hearth_mesh"]
hearth_animation = ["dep:hearth_animation", "hearth_mesh"]
hearth_mikktspace = ["hearth_mesh?/hearth_mikktspace"]
hearth_window = ["dep:hearth_window", "dep:hearth_a11y", "hearth_image"]
hearth_winit = ["dep:hearth_winit", "hearth_window", "hearth_soft_render?/desktop"]
hearth_camera = ["dep:hearth_camera", "hearth_mesh", "hearth_window"]
hearth_world_serialization = ["dep:hearth_world_serialization", "hearth_asset"]
hearth_material = ["dep:hearth_material", "hearth_image", "hearth_shader"]
hearth_light = ["dep:hearth_light", "hearth_camera"]
hearth_render = [
  "dep:hearth_render",
  "hearth_camera",
  "hearth_extract",
  "hearth_shader",
  "hearth_color/wgpu-types",
  "hearth_color/encase",
  "hearth_remote?/hearth_render",
]
hearth_core_pipeline = ["dep:hearth_core_pipeline", "hearth_render"]
hearth_anti_alias = ["dep:hearth_anti_alias", "hearth_core_pipeline"]
hearth_post_process = ["dep:hearth_post_process", "hearth_core_pipeline"]
hearth_pbr = [
  "dep:hearth_pbr",
  "hearth_light",
  "hearth_material",
  "hearth_core_pipeline",
  "hearth_gizmos_render?/hearth_pbr",
]
hearth_soft_render = [
  "dep:hearth_soft_render",
  "hearth_sprite",
  "hearth_remote?/hearth_soft_render",
]
hearth_sprite_render = [
  "dep:hearth_sprite_render",
  "hearth_sprite",
  "hearth_material",
  "hearth_core_pipeline",
  "hearth_gizmos_render?/hearth_sprite_render",
]
hearth_ui_render = ["dep:hearth_ui_render", "hearth_sprite_render", "hearth_ui"]
# Feathers ships its built-in icons as PNGs, so enable the PNG feature
hearth_feathers = ["dep:hearth_feathers", "png"]
hearth_inspector = ["dep:hearth_inspector", "hearth_feathers"]
hearth_editor = [
  "dep:hearth_editor",
  "hearth_inspector",
  "hearth_remote_client",
  "hearth_gltf",
  "hearth_pbr",
  "hearth_world_serialization",
]
hearth_solari = ["dep:hearth_solari", "hearth_pbr"]
hearth_gizmos = ["dep:hearth_gizmos", "hearth_camera", "hearth_light?/hearth_gizmos"]
hearth_gizmos_render = ["dep:hearth_gizmos_render", "hearth_gizmos"]
hearth_gltf = ["dep:hearth_gltf", "hearth_world_serialization", "hearth_pbr?/hearth_gltf"]

# Enable AccessKit on Unix backends (currently only works with experimental
# screen readers and forks.)
accesskit_unix = ["hearth_winit/accesskit_unix"]

# Enable Feral Interactive's `GameMode` integration on Linux
linux_game_mode = ["hearth_winit/linux_game_mode"]

# Enable assertions to check the validity of parameters passed to glam
glam_assert = ["hearth_math/glam_assert"]

# Enable assertions in debug builds to check the validity of parameters passed to glam
debug_glam_assert = ["hearth_math/debug_glam_assert"]

# Include a default font, containing only ASCII characters, at the cost of a 20kB binary size increase
default_font = ["hearth_text?/default_font"]

# Allows for discovery of preloaded system fonts
system_font_discovery = ["hearth_text?/system_font_discovery"]

# Enables dictionary-based segmentation for complex scripts (CJK, Thai, Khmer, Lao, Myanmar), at the cost of a larger binary
complex_script_segmentation = ["hearth_text?/complex_script_segmentation"]

# Enables downloading assets from HTTP sources
http = ["hearth_asset?/http"]

# Enables downloading assets from HTTPS sources
https = ["hearth_asset?/https"]

# Enable caching downloaded assets on the filesystem. NOTE: this cache currently never invalidates entries!
web_asset_cache = ["hearth_asset?/web_asset_cache"]

# Enables the built-in asset processor for processed assets.
asset_processor = ["hearth_asset?/asset_processor"]

# Enables watching the filesystem for Hearth Asset hot-reloading
file_watcher = ["hearth_asset?/file_watcher"]

# Enables watching embedded files for Hearth Asset hot-reloading
embedded_watcher = ["hearth_asset?/embedded_watcher"]

# Enable system stepping support
hearth_debug_stepping = [
  "hearth_ecs/hearth_debug_stepping",
  "hearth_app/hearth_debug_stepping",
  "hearth_remote?/hearth_debug_stepping",
]

# Enables the meshlet renderer for dense high-poly scenes (experimental)
meshlet = ["hearth_pbr?/meshlet"]

# Enables processing meshes into meshlet meshes for hearth_pbr
meshlet_processor = ["hearth_pbr?/meshlet_processor"]

# Provides a collection of developer tools
hearth_dev_tools = ["dep:hearth_dev_tools"]
hearth_audio = ["dep:hearth_audio", "hearth_dev_tools?/hearth_audio"]

# Provides a collection of prebuilt camera controllers
hearth_camera_controller = ["dep:hearth_camera_controller"]
free_camera = ["hearth_camera_controller/free_camera"]
pan_camera = ["hearth_camera_controller/pan_camera"]
pan_orbit_camera = [
  "hearth_camera_controller/pan_orbit_camera",
  "hearth_camera_controller/extension_independent_skybox",
]

pan_orbit_gizmo = [
  "hearth_gizmos",
  "hearth_camera_controller/extension_anchor_indicator",
]

# Enable support for the Hearth Remote Protocol
hearth_remote = ["dep:hearth_remote", "serialize"]
hearth_remote_client = [
  "hearth_remote",
  "hearth_remote/client",
  "hearth_inspector?/remote",
]

# Provides picking functionality without any backend
hearth_picking = ["dep:hearth_picking"]

# Provides a mesh picking backend
mesh_picking = ["hearth_picking", "hearth_picking/mesh_picking"]

# Provides a sprite picking backend
sprite_picking = ["hearth_picking", "hearth_sprite?/hearth_picking"]

# Provides a UI picking backend
ui_picking = [
  "hearth_picking",
  "hearth_ui?/hearth_picking",
  "hearth_input_focus?/hearth_picking",
]

# Provides a UI debug overlay
hearth_ui_debug = ["hearth_ui_render?/hearth_ui_debug"]

# Enable built in global state machines
hearth_state = ["dep:hearth_state"]

# Enables source location tracking for change detection, which can assist with debugging
track_location = ["hearth_ecs/track_location"]

# Enable function reflection
reflect_functions = [
  "hearth_reflect/functions",
  "hearth_app/reflect_functions",
  "hearth_ecs/reflect_functions",
  "hearth_render?/reflect_functions",
]

# Enable automatic reflect registration using inventory.
reflect_auto_register = [
  "hearth_reflect/auto_register_inventory",
  "hearth_app/reflect_auto_register",
  "hearth_ecs/reflect_auto_register",
  "hearth_render?/reflect_auto_register",
]

# Enable automatic reflect registration without inventory. See `reflect::load_type_registrations` for more info.
reflect_auto_register_static = [
  "hearth_reflect/auto_register_static",
  "hearth_app/reflect_auto_register",
  "hearth_ecs/reflect_auto_register",
  "hearth_render?/reflect_auto_register",
]

# Enables hearth_reflect to access documentation comments of Rust code at runtime
reflect_documentation = ["hearth_reflect/reflect_documentation"]

# Enable custom cursor support
custom_cursor = [
  "hearth_window/custom_cursor",
  "hearth_winit/custom_cursor",
  "hearth_picking/custom_cursor",
]

# Allows access to the `std` crate. Enabling this feature will prevent compilation
# on `no_std` targets, but provides access to certain additional features on
# supported platforms.
std = [
  "hearth_a11y?/std",
  "hearth_app/std",
  "hearth_color?/std",
  "hearth_diagnostic/std",
  "hearth_ecs/std",
  "hearth_input/std",
  "hearth_input_focus?/std",
  "hearth_math/std",
  "hearth_shape/std",
  "hearth_curve?/std",
  "hearth_platform/std",
  "hearth_reflect/std",
  "hearth_state?/std",
  "hearth_time/std",
  "hearth_transform/std",
  "hearth_window?/std",
]

# `critical-section` provides the building blocks for synchronization primitives
# on all platforms, including `no_std`.
critical-section = [
  "hearth_a11y?/critical-section",
  "hearth_app/critical-section",
  "hearth_diagnostic/critical-section",
  "hearth_ecs/critical-section",
  "hearth_input/critical-section",
  "hearth_input_focus?/critical-section",
  "hearth_platform/critical-section",
  "hearth_reflect/critical-section",
  "hearth_state?/critical-section",
  "hearth_time/critical-section",
]

# Uses the `libm` maths library instead of the one provided in `std` and `core`.
libm = [
  "hearth_color?/libm",
  "hearth_input/libm",
  "hearth_input_focus?/libm",
  "hearth_math/libm",
  "hearth_transform/libm",
  "hearth_window?/libm",
]

# Uses `async-executor` as a task execution backend.
# This backend is incompatible with `no_std` targets.
async_executor = [
  "std",
  "hearth_tasks/async_executor",
  "hearth_ecs/async_executor",
  "hearth_transform/async_executor",
]

# Enables use of browser APIs.
# Note this is currently only applicable on `wasm32` architectures.
web = ["hearth_app/web", "hearth_platform/web", "hearth_reflect/web"]

# Input sources.
mouse = ["hearth_input/mouse", "hearth_input_focus?/mouse"]
keyboard = ["hearth_input/keyboard", "hearth_input_focus?/keyboard"]
gamepad = ["hearth_input/gamepad", "hearth_input_focus?/gamepad"]
touch = ["hearth_input/touch"]
gestures = ["hearth_input/gestures"]

# Clipboard support
hearth_clipboard = ["dep:hearth_clipboard"]
system_clipboard = [
  "dep:hearth_clipboard",
  "hearth_clipboard/system_clipboard",
  "hearth_text?/system_clipboard",
]
clipboard_image = ["dep:hearth_clipboard", "hearth_clipboard/image"]

hotpatching = ["hearth_app/hotpatching", "hearth_ecs/hotpatching"]

debug = ["hearth_utils/debug", "hearth_ecs/debug", "hearth_render?/debug"]

screenrecording = ["hearth_dev_tools/screenrecording"]
schedule_data = ["hearth_dev_tools/schedule_data"]

# Keep feature for hearth-settings as hearth_settings
hearth_settings = ["hearth-settings", "hearth_feathers?/hearth_settings"]

[dependencies]
# hearth (no_std)
hearth_annotations = { path = "../hearth_annotations", version = "0.20.0-dev", default-features = false }
hearth_app = { path = "../hearth_app", version = "0.20.0-dev", default-features = false, features = [
  "hearth_reflect",
] }
hearth_derive = { path = "../hearth_derive", version = "0.20.0-dev", default-features = false }
hearth_diagnostic = { path = "../hearth_diagnostic", version = "0.20.0-dev", default-features = false }
hearth_ecs = { path = "../hearth_ecs", version = "0.20.0-dev", default-features = false, features = [
  "hearth_reflect",
] }
hearth_input = { path = "../hearth_input", version = "0.20.0-dev", default-features = false, features = [
  "hearth_reflect",
] }
hearth_math = { path = "../hearth_math", version = "0.20.0-dev", default-features = false, features = [
  "hearth_reflect",
  "nostd-libm",
] }
hearth_shape = { path = "../hearth_shape", version = "0.20.0-dev", default-features = false, features = [
  "hearth_reflect",
] }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev", default-features = false, features = [
  "alloc",
] }
hearth_ptr = { path = "../hearth_ptr", version = "0.20.0-dev", default-features = false }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", default-features = false, features = [
  "smallvec",
] }
hearth_time = { path = "../hearth_time", version = "0.20.0-dev", default-features = false, features = [
  "hearth_reflect",
] }
hearth_transform = { path = "../hearth_transform", version = "0.20.0-dev", default-features = false, features = [
  "hearth-support",
  "hearth_reflect",
] }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev", default-features = false }
hearth_tasks = { path = "../hearth_tasks", version = "0.20.0-dev", default-features = false }

# hearth (std required)
hearth_log = { path = "../hearth_log", version = "0.20.0-dev", optional = true }

# hearth (optional)
hearth_a11y = { path = "../hearth_a11y", optional = true, version = "0.20.0-dev", features = [
  "hearth_reflect",
] }
hearth_camera_controller = { path = "../hearth_camera_controller", optional = true, version = "0.20.0-dev", default-features = false }
hearth_curve = { path = "../hearth_curve", optional = true, version = "0.20.0-dev", default-features = false, features = [
  "alloc",
  "hearth_reflect",
] }
hearth_animation = { path = "../hearth_animation", optional = true, version = "0.20.0-dev" }
hearth_asset = { path = "../hearth_asset", optional = true, version = "0.20.0-dev" }
hearth_audio = { path = "../hearth_audio", optional = true, version = "0.20.0-dev" }
hearth_bsn = { path = "../hearth_bsn", optional = true, version = "0.20.0-dev" }
hearth_color = { path = "../hearth_color", optional = true, version = "0.20.0-dev", default-features = false, features = [
  "alloc",
  "hearth_reflect",
] }
hearth_core_pipeline = { path = "../hearth_core_pipeline", optional = true, version = "0.20.0-dev" }
hearth_post_process = { path = "../hearth_post_process", optional = true, version = "0.20.0-dev" }
hearth_ui_widgets = { path = "../hearth_ui_widgets", optional = true, version = "0.20.0-dev" }
hearth_anti_alias = { path = "../hearth_anti_alias", optional = true, version = "0.20.0-dev" }
hearth_dev_tools = { path = "../hearth_dev_tools", optional = true, version = "0.20.0-dev" }
hearth_extract = { path = "../hearth_extract", optional = true, version = "0.20.0-dev" }
hearth_gilrs = { path = "../hearth_gilrs", optional = true, version = "0.20.0-dev" }
hearth_gizmos = { path = "../hearth_gizmos", optional = true, version = "0.20.0-dev", default-features = false }
hearth_gizmos_render = { path = "../hearth_gizmos_render", optional = true, version = "0.20.0-dev", default-features = false }
