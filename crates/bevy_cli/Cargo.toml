[package]
name = "bevy_cli"
version = "0.20.0-dev"
edition = "2024"
description = "A command line interface for building, running, inspecting and driving Hearth apps, for developers and agents"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["hearth", "bevy", "cli", "gamedev"]
categories = ["command-line-utilities", "game-development"]

[[bin]]
name = "hearth"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0-dev" }
bevy_remote = { path = "../bevy_remote", version = "0.20.0-dev", default-features = false, features = [
  "http",
] }
bevy_time = { path = "../bevy_time", version = "0.20.0-dev" }

[lints]
workspace = true
