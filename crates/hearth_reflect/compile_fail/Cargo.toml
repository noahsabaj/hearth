[package]
name = "hearth_reflect_compile_fail"
edition = "2024"
description = "Compile fail tests for Hearth Engine's reflection system"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
hearth_reflect = { path = "../", features = ["functions"] }

[dev-dependencies]
compile_fail_utils = { path = "../../../tools/compile_fail_utils" }

[[test]]
name = "derive"
harness = false

[[test]]
name = "func"
harness = false

[[test]]
name = "remote"
harness = false

[lints]
workspace = true
