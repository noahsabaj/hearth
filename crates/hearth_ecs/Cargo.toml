[package]
name = "hearth_ecs"
version = "0.20.0-dev"
edition = "2024"
description = "Hearth Engine's entity component system"
homepage = "https://github.com/noahsabaj/hearth"
repository = "https://github.com/noahsabaj/hearth"
license = "MIT OR Apache-2.0"
keywords = ["ecs", "game", "hearth"]
categories = ["game-engines", "data-structures"]
rust-version = "1.95.0"

[features]
default = ["std", "hearth_reflect", "async_executor", "backtrace"]

# Functionality

## Enables multithreading support. Schedules will attempt to run systems on
## multiple threads whenever possible.
multi_threaded = ["hearth_tasks/multi_threaded"]

## Adds serialization support through `serde`.
serialize = ["dep:serde", "hearth_platform/serialize", "indexmap/serde"]

## Adds runtime reflection support using `hearth_reflect`.
hearth_reflect = ["dep:hearth_reflect"]

## Extends reflection support to functions.
reflect_functions = ["hearth_reflect", "hearth_reflect/functions"]
reflect_auto_register = ["hearth_reflect", "hearth_reflect/auto_register"]

## Enables automatic backtrace capturing in HearthError
backtrace = ["std"]

# Debugging Features

## Enables `tracing` integration, allowing spans and other metrics to be reported
## through that framework.
trace = ["std", "dep:tracing"]

# Enable collecting debug information about systems and components to help with diagnostics
debug = ["hearth_utils/debug", "hearth_reflect?/debug", "dep:rand"]

## Enables a more detailed set of traces which may be noisy if left on by default.
detailed_trace = ["trace"]

## Provides system stepping support, allowing them to be paused, stepped, and
## other debug operations which can help with diagnosing certain behaviors.
hearth_debug_stepping = []

## Provides more detailed tracking of the cause of various effects within the ECS.
## This will often provide more detailed error messages.
track_location = []

# Executor Backend

## Uses `async-executor` as a task execution backend.
## This backend is incompatible with `no_std` targets.
async_executor = ["std", "hearth_tasks/async_executor"]

# Platform Compatibility

## Allows access to the `std` crate. Enabling this feature will prevent compilation
## on `no_std` targets, but provides access to certain additional features on
## supported platforms.
std = [
  "hearth_reflect?/std",
  "hearth_utils/parallel",
  "hearth_utils/std",
  "bitflags/std",
  "concurrent-queue/std",
  "fixedbitset/std",
  "indexmap/std",
  "serde?/std",
  "nonmax/std",
  "arrayvec/std",
  "log/std",
  "hearth_platform/std",
]

## `critical-section` provides the building blocks for synchronization primitives
## on all platforms, including `no_std`.
critical-section = [
  "hearth_platform/critical-section",
  "hearth_reflect?/critical-section",
]

hotpatching = ["dep:subsecond"]

[dependencies]
hearth_ptr = { path = "../hearth_ptr", version = "0.20.0-dev" }
hearth_reflect = { path = "../hearth_reflect", version = "0.20.0-dev", features = [
  "smallvec",
  "indexmap",
], default-features = false, optional = true }
hearth_tasks = { path = "../hearth_tasks", version = "0.20.0-dev", default-features = false }
hearth_utils = { path = "../hearth_utils", version = "0.20.0-dev", default-features = false }
hearth_ecs_macros = { path = "macros", version = "0.20.0-dev" }
hearth_platform = { path = "../hearth_platform", version = "0.20.0-dev", default-features = false, features = [
  "alloc",
] }

bitflags = { version = "2.3", default-features = false }
fixedbitset = { version = "0.5", default-features = false }
serde = { version = "1", default-features = false, features = [
  "alloc",
  "serde_derive",
], optional = true }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = [
  "from",
  "display",
  "into",
  "as_ref",
] }
nonmax = { version = "0.5.4", default-features = false }
arrayvec = { version = "0.7.4", default-features = false }
smallvec = { version = "1", default-features = false, features = [
  "union",
  "const_generics",
] }
indexmap = { version = "2.5.0", default-features = false }
variadics_please = { version = "2.0", default-features = false }
tracing = { version = "0.1", default-features = false, optional = true }
log = { version = "0.4", default-features = false }
bumpalo = "3"
subsecond = { version = "0.7.0-rc.0", optional = true }
slotmap = { version = "1.0.7", default-features = false }
rand = { version = "0.10", default-features = false, optional = true }

concurrent-queue = { version = "2.5.0", default-features = false }
[target.'cfg(not(all(target_has_atomic = "8", target_has_atomic = "16", target_has_atomic = "32", target_has_atomic = "64", target_has_atomic = "ptr")))'.dependencies]
concurrent-queue = { version = "2.5.0", default-features = false, features = [
  "portable-atomic",
] }

[dev-dependencies]
rand = "0.10"
static_assertions = "1.1.0"
serde_test = "1.0"

[[example]]
name = "events"
path = "examples/events.rs"

[[example]]
name = "resources"
path = "examples/resources.rs"

[[example]]
name = "change_detection"
path = "examples/change_detection.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
features = ["hearth_reflect/auto_register_static"]
