[package]
name = "zero_day"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
hearth = { path = "../../..", features = [
  "hearth_camera_controller",
  "free_camera",
  "hearth_solari",
  # The scene is downloaded on first run and then served from `.web-asset-cache`.
  "https",
  "web_asset_cache",
] }

argh = "0.1.12"

[features]
# Use `--features dlss` to enable denoising with DLSS Ray Reconstruction in Solari. It
# is off by default because a build with it needs the DLSS SDK.
dlss = ["hearth/dlss"]
force_disable_dlss = ["hearth/force_disable_dlss"]
