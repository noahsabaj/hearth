[package]
name = "mipmap_generator"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
hearth = { path = "../../../", default-features = false, features = [
  "hearth_asset",
  "hearth_world_serialization",
  "hearth_pbr",
  "ktx2",
  "jpeg",
  "multi_threaded",
] }
image = { version = "0.25.2", default-features = false }
fast_image_resize = { version = "6.0", features = ["image"] }
futures-lite = "2.0.1"
tracing = "0.1"
intel_tex_2 = { version = "0.5.0", optional = true }
zstd = { version = "0.14.0", optional = true }

[dev-dependencies]
hearth = { path = "../../../" }
argh = "0.1.12"

[features]
default = ["debug_text", "hearth_zstd_rust"]
compress = ["dep:intel_tex_2", "dep:zstd"]
debug_text = ["hearth/hearth_ui"]
pbr_transmission_textures = ["hearth/pbr_transmission_textures"]
pbr_multi_layer_material_textures = ["hearth/pbr_multi_layer_material_textures"]
pbr_anisotropy_texture = ["hearth/pbr_anisotropy_texture"]
pbr_specular_textures = ["hearth/pbr_specular_textures"]
hearth_zstd_rust = ["hearth/zstd_rust"]
hearth_zstd_c = ["hearth/zstd_c"]

[lints]
workspace = true
