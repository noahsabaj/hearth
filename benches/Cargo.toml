[package]
name = "benches"
edition = "2024"
description = "Benchmarks that test Hearth's performance"
publish = false
license = "MIT OR Apache-2.0"
# Do not automatically discover benchmarks, we specify them manually instead.
autobenches = false

[dependencies]
# The primary crate that runs and analyzes our benchmarks. This is a regular dependency because the
# `bench!` macro refers to it in its documentation.
criterion = { version = "0.8.0", features = ["html_reports"] }
seq-macro = "0.3.6"

# Hearth crates
hearth_app = { path = "../crates/hearth_app", optional = true }
hearth_curve = { path = "../crates/hearth_curve", optional = true }
hearth_ecs = { path = "../crates/hearth_ecs", optional = true, features = [
  "multi_threaded",
] }
hearth_extract = { path = "../crates/hearth_extract", optional = true }
hearth_math = { path = "../crates/hearth_math", optional = true }
hearth_shape = { path = "../crates/hearth_shape", optional = true }
hearth_picking = { path = "../crates/hearth_picking", optional = true, features = [
  "mesh_picking",
] }
hearth_reflect = { path = "../crates/hearth_reflect", optional = true, features = [
  "functions",
] }
hearth_camera = { path = "../crates/hearth_camera", optional = true }
hearth_mesh = { path = "../crates/hearth_mesh", optional = true }
hearth_asset = { path = "../crates/hearth_asset", optional = true }
hearth_render = { path = "../crates/hearth_render", optional = true }
hearth_scene = { path = "../crates/hearth_scene", optional = true }
hearth_tasks = { path = "../crates/hearth_tasks", optional = true }
hearth_text = { path = "../crates/hearth_text", optional = true }
hearth_transform = { path = "../crates/hearth_transform", optional = true }
hearth_ui = { path = "../crates/hearth_ui", optional = true }
hearth_ui_widgets = { path = "../crates/hearth_ui_widgets", optional = true }
hearth_platform = { path = "../crates/hearth_platform", optional = true, default-features = false, features = [
  "std",
  "bytemuck",
] }

# Other crates
glam = { version = "0.33.2", default-features = false, features = [
  "std",
  "all-types",
  "rand",
  "bytemuck",
] }
rand = "0.10"
chacha20 = { version = "0.10.0", default-features = false, features = ["rng"] }
nonmax = { version = "0.5", default-features = false }
bytemuck = { version = "1", default-features = false, features = [
  "derive",
  "must_cast",
] }

[features]
default = [
  "bench_camera",
  "bench_ecs",
  "bench_math",
  "bench_picking",
  "bench_platform",
  "bench_reflect",
  "bench_render",
  "bench_scene",
  "bench_tasks",
  "bench_text",
  "bench_transform",
  "bench_ui",
]

bench_camera = ["dep:hearth_camera", "dep:hearth_math", "dep:hearth_shape"]

bench_ecs = [
  "dep:hearth_ecs",
  "dep:hearth_app",
  "dep:hearth_math",
  "dep:hearth_reflect",
  "dep:hearth_tasks",
  "hearth_math/hearth_reflect",
]

bench_math = ["dep:hearth_math", "dep:hearth_curve", "dep:hearth_shape"]

bench_picking = ["dep:hearth_picking", "dep:hearth_math", "dep:hearth_shape"]

bench_platform = [
  "dep:hearth_platform",
  "dep:hearth_math",
  "bytemuck/min_const_generics",
]

bench_reflect = ["dep:hearth_reflect", "dep:hearth_platform"]

bench_render = [
  "dep:hearth_render",
  "dep:hearth_app",
  "dep:hearth_asset",
  "dep:hearth_camera",
  "dep:hearth_ecs",
  "dep:hearth_extract",
  "dep:hearth_mesh",
  "dep:hearth_reflect",
]

bench_scene = [
  "dep:hearth_scene",
  "dep:hearth_app",
  "dep:hearth_asset",
  "dep:hearth_ecs",
  "dep:hearth_ui",
  "dep:hearth_ui_widgets",
  "dep:hearth_reflect",
]

bench_tasks = ["dep:hearth_tasks"]

bench_text = [
  "dep:hearth_text",
  "dep:hearth_app",
  "dep:hearth_asset",
  "dep:hearth_ecs",
  "dep:hearth_math",
]

bench_transform = [
  "dep:hearth_transform",
  "dep:hearth_ecs",
  "dep:hearth_math",
  "dep:hearth_tasks",
]

bench_ui = [
  "dep:hearth_ui",
  "dep:hearth_app",
  "dep:hearth_camera",
  "dep:hearth_ecs",
  "dep:hearth_text",
]

[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

# see: upstream PR #15375
too_long_first_doc_paragraph = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lib]
# This fixes the "Unrecognized Option" error when running commands like
# `cargo bench -- --save-baseline before` by disabling the default benchmark harness.
# See <https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options>
# for more information.
bench = false

[[bench]]
name = "ecs"
path = "benches/hearth_ecs/main.rs"
harness = false
required-features = ["bench_ecs"]

[[bench]]
name = "math"
path = "benches/hearth_math/main.rs"
harness = false
required-features = ["bench_math"]

[[bench]]
name = "picking"
path = "benches/hearth_picking/main.rs"
harness = false
required-features = ["bench_picking"]

[[bench]]
name = "reflect"
path = "benches/hearth_reflect/main.rs"
harness = false
required-features = ["bench_reflect"]

[[bench]]
name = "render"
path = "benches/hearth_render/main.rs"
harness = false
required-features = ["bench_render"]

[[bench]]
name = "scene"
path = "benches/hearth_scene/main.rs"
harness = false
required-features = ["bench_scene"]

[[bench]]
name = "tasks"
path = "benches/hearth_tasks/main.rs"
harness = false
required-features = ["bench_tasks"]

[[bench]]
name = "camera"
path = "benches/hearth_camera/main.rs"
harness = false
required-features = ["bench_camera"]

[[bench]]
name = "transform"
path = "benches/hearth_transform/main.rs"
harness = false
required-features = ["bench_transform"]

[[bench]]
name = "platform"
path = "benches/hearth_platform/main.rs"
harness = false
required-features = ["bench_platform"]

[[bench]]
name = "ui"
path = "benches/hearth_ui/main.rs"
harness = false
required-features = ["bench_ui"]

[[bench]]
name = "text"
path = "benches/hearth_text/main.rs"
harness = false
required-features = ["bench_text"]
